<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="main">
    <title>TechHub - Registration</title>
</head>
<body>
    <nav>
        <a href="index.html"><b>Home</b></a>
        <a href="Contact.html"><b>Contact</b></a>
    </nav>
    <h1>Registration</h1>
    <section>
        <form>
            <label for="First_Name">First Name: </label>
            <input type="text" id="First_Name"><br><br>

            <label for="Last_Name">Last Name: </label>
            <input type="text" id="Last_Name"><br><br>

            <label for="Email">Email: </label>
            <input type="email" id="Email"><br><br>

            <label for="Phone_Number">Phone Number: </label>
            <input type="number" id="Phone_Number"><br><br>

            <label for="Date_Of_Birth">Date Of Birth: </label>
            <input type="date" id="Date_Of_Birth"><br><br>

            <label>Gender: </label><br><br>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender" value="Female"><br><br>

            <label for="Chad">Are You a Chad?</label>
            <input type="checkbox" id="Chad"><br><br>

            <input type="submit">
        </form>
    </section>
</body>
</html>
