<!--4) შექმენით ფორმა, რომელიც შეიცავს 'Full Name', 'Age', 'Email' და 'Phone Number' ველებს. მხოლოდ 'Full Name' და 'Email' ველებს მიანიჭეთ 'required' ატრიბუტი. ახსენით, რა განსხვავებაა სავალდებულო და არასავალდებულო ველებს შორის.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
        <label for="Full_Name">Full Name: </label>
        <input id="Full_Name" type="text" name="Full_Name" required><br><br>

        <label for="Age">Age </label>
        <input id="Age" type="number" name="Age" required><br><br>

        <label for="Phone_Number">Phone Number: </label>
        <input id="Phone_Number" type="number" name="Phone_Number" required><br><br>

        <label for="email">Email: </label>
        <input id="email" type="email" name="email" required><br><br>

        <input type="submit">
    </form>
</body>
</html>

<!--სავალდებულო ველი (required) აუცილებლად უნდა შეივსოს, ცარიელი ფორმა არ იგზავნება. არასავალდებულო ველი შეიძლება ცარიელი დარჩეს და ფორმა მაინც გაიგზავნება.-->
