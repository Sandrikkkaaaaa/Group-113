<!--6) შექმენით მსგავსი ფორმა:-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact Details</h1>
    <p><b>Please Enter Your Personal Details Here:</b></p>
    <form>
        <label for="Full_Name">Full Name*: </label>
        <input id="Full_Name" type="text" name="Full_Name" required><br><br>

        <label for="Street_Address">Street Address*: </label>
        <input id="Street_Address" type="text" name="Street_Address" required><br><br>

        <label for="Town/City">Town/City: </label>
        <input id="Town/City" type="text" name="Town/City"><br><br>

        <label for="Postcode/Zip">Postcode/Zip: </label>
        <input id="Postcode/Zip" type="number" name="Postcode/Zip"><br><br>

        <label for="Telephone">Telephone: </label>
        <input id="Telephone" type="number" name="Telephone"><br><br>

        <label for="Mobile">Mobile: </label>
        <input id="Mobile" type="number" name="Mobile"><br><br>

        <label for="Email">Email*: </label>
        <input id="Email" type="email" name="Email" required><br><br>

        <input type="submit">
    </form>
    <p><u>Fields Marked * Are Required</u></p>
</body>
</html>
