<!--3) შექმენით სარეგისტრაციო ფორმა, რომელიც შეიცავს 'Username', 'Email' და 'Password' ველებს. თითოეულ Input-ს მიანიჭეთ შესაბამისი 'name' და 'required' ატრიბუტები. დაამატეთ Submit ღილაკი და გატესტეთ ფორმის მუშაობა.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <form>
        <label for="Username">Username: </label>
        <input id="Username" type="text" name="Username" required><br><br>

        <label for="email">Email: </label>
        <input id="email" type="email" name="email" required><br><br>

        <label for="Password">Password: </label>
        <input id="Password" type="password" name="Password" required><br><br>

        <input type="submit">
    </form>
</body>
</html>
