<!DOCTYPE html>
<head>
    <title>Register</title>
</head>
    <body style="background-color:rgb(100, 237, 237)"">
        <form>
            <a href="index.html"><b>Main Page</b></a><br>
            <h1>Registration: </h1>
            <label>First Name:</label>
            <input type="text" placeholder="შეიყვანეთ თქვენი სახელი">
            <br>
            <label>Last Name:</label>
            <input type="text" placeholder="შეიყვანეთ თქვენი გვარი">
            <br>
            <label>Date Of Birth: </label>
            <input type="date">
            <br>
            <label>Mobile Number: </label>
            <input type="number" placeholder="შეიყვანეთ ნომერი">
            <br>
            <label>Gmail: </label>
            <input type="email" placeholder="შეიყვანეთ ემაილი">
            <br>
            <label>Gender: </label><br>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender">
            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender"><br>
            <label>Did You Agree To The Terms & Conditions: </label>
            <input type="checkbox">
            <br>
            <input type="submit">
            
        </form>

    </body>
</html>
