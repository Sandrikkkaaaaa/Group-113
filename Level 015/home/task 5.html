<!--5) შექმენით ფორმა, რომელშიც მომხმარებელი აირჩევს სქესს (Male, Female, Other) Radio Button-ების გამოყენებით. ყველა Radio Button-ს მიანიჭეთ ერთი და იგივე 'name', მაგრამ განსხვავებული 'value'. ახსენით, რატომ უნდა ჰქონდეთ საერთო 'name' და განსხვავებული 'value' ატრიბუტები.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <p>საერთო name: აერთიანებს Radio ღილაკებს ერთ ჯგუფად, რომ მხოლოდ ერთი მოინიშნოს და სერვერზე ერთ სახელით გაიგზავნოს.</p>
        <p>განსხვავებული value: საჭიროა იმის გასარჩევად, კონკრეტულად რომელი ვარიანტი აირჩია მომხმარებელმა.</p>
        <p>აირჩიეთ სქესი:</p>

        <label>Male</label>
        <input type="radio" name="gender" value="Male">

        <label>Female</label>
        <input type="radio" name="gender" value="Female">

        <label>Other</label>
        <input type="radio" name="gender" value="Other">

        <button type="submit">გაგზავნა</button>
    </form>
</body>
</html>
