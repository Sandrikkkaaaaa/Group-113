<!--3) ახსენით, რა არის 'value' ატრიბუტი და რა დანიშნულება აქვს HTML ფორმაში. შექმენით 3 Input განსხვავებული 'name' და 'value' ატრიბუტებით. ახსენით, რა განსხვავებაა მათ შორის.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
</head>
<body>
    <p>value ატრიბუტი განსაზღვრავს ფორმის ელემენტის მნიშვნელობას — ანუ იმ ინფორმაციას, რომელიც სერვერზე გაიგზავნება name გასაღებთან ერთად name=value</p>


<form>
    <input type="text" name="city" value="Tbilisi">

    <input type="radio" name="gender" value="male">

    <input type="number" name="age" value="25">
</form>
</body>
</html>
