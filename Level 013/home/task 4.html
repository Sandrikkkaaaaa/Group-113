<html>
    <head>
        <meta author="Aleksandre Keshelashvili">
    </head>
    <body>
        <h1>Registration</h1>
        <form>
            <label for="Name">First Name: </label>
            <input type="text" id="Name"><br><br>

            <label for="Last Name">Last Name: </label>
            <input type="text" id="Last Name"><br><br>

            <label for="Email">Email: </label>
            <input type="email" id="Email"><br><br>

            <label>Gender</label><br><br>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender">
            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender"><br><br>

            <label for="Date_Of_Birth">Date Of Birth</label>
            <input type="date" id="Date_Of_Birth"><br><br>

            <input type="checkbox" id="Terms and Conditions">
            <label for="Terms and Conditions">Did you agree to the <u>Terms & Conditions</u> And <u>Privacy Policy</u></label><br><br>

            <input type="submit">
        </form>
    </body>
</html>
