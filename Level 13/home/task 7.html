<!--7) შექმენით ფორმა ყველა კარგი პრაქტიკის დაცვით, ისე თითქმოს ინფორმაციას მონაცემთა ბაზაში აგზავნიდეთ (name, value, required), რომელშიც უნდა იყოს შემდეგი შესატანი ველები:-->

<html>
    <head>
        <meta author="Aleksandre Keshelashvili">
    </head>
    <body>
        <form>
            <label for="Full_Name">Full Name: </label>
            <input type="text" id="Full_Name" name="full_name" required><br><br>

            <label for="Email">Email: </label>
            <input type="email" id="Email" name="Email" required><br><br>

            <label for="Age">Age: </label>
            <input type="number" id="Age" name="Age" required><br><br>

            <label for="City">City: </label>
            <input type="text" id="City" name="City" required><br><br>

            <label>Gender:</label><br><br>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender" value="Male" required>
            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Other">Other</label>
            <input type="radio" id="Other" name="Gender" value="Other"><br><br><br><br>

            <label>Hobbies: </label><br><br>
            <label for="Reading">Reading</label>
            <input type="checkbox" id="Reading" name="Hobbies" value="Reading">
            <label for="Sports">Sports</label>
            <input type="checkbox" id="Sports" name="Hobbies" value="Sports">
            <label for="Music">Music</label>
            <input type="checkbox" id="Music" name="Hobbies" value="Music">
            <label for="Programming">Programming</label>
            <input type="checkbox" id="Programming" name="Hobbies" value="Programming"><br><br><br><br>

            <input type="submit">
        </form>
    </body>
</html>
